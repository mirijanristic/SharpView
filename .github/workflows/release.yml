name: Release

# Objavljuje release kada gurnes tag oblika v1.0.0
# Rucno pokretanje (workflow_dispatch) pravi iste artefakte bez release-a.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Verzija za probni build (bez v)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

env:
  PROJECT: src/SharpView/SharpView.csproj

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Odredi verziju
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "Neispravna verzija: '$v' (ocekivano npr. 1.0.0)"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Verzija: $v"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r win-x64

      # Testovi se vrte na CoreCLR-u (PublishAot ne utice na dotnet test);
      # AOT/trim analizatori su ukljuceni i ovdje, pa nekompatibilan kod
      # obara build prije nego sto dodje do publish-a.
      - name: Test
        run: dotnet test -c Release

      # ----------------------------------------------------------------------
      # Jedan jedini publish: Native AOT (PublishAot je u csproj-u).
      # Izlaz je nativni exe + LibRaw dll-ovi - nema .NET runtime zavisnosti,
      # pa isti folder hrani i instaler i portable ZIP. MSVC linker koji AOT
      # trazi je preinstaliran na windows-latest runneru (VS 2022 + C++).
      # NAPOMENA: --self-contained / PublishReadyToRun / PublishSingleFile se
      # NE smiju prosljedjivati - sudaraju se sa PublishAot.
      # ----------------------------------------------------------------------
      - name: Publish (Native AOT)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r win-x64
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      # ----------------------------------------------------------------------
      # Portable ZIP: publish izlaz (bez PDB simbola) + app-local VC++ CRT.
      # raw_r.dll (LibRaw, vcpkg build) vuce vcruntime140/msvcp140/vcomp140;
      # instaler to rjesava preuzimanjem VC redist-a, ali portable korisnik
      # nema instaler - zato ZIP nosi te dll-ove pored exe-a (app-local
      # deployment, dozvoljen nacin redistribucije VC runtimea). Kopiraju se
      # sa runnerovog VS-a. Bez njih bi na cistoj masini sve radilo OSIM
      # NEF/RAW podrske, koja bi tiho nestala.
      # ----------------------------------------------------------------------
      - name: Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable, dist | Out-Null
          Copy-Item publish\* portable\ -Recurse -Exclude *.pdb

          # VS lociramo preko vswhere (fiksna putanja "...\2022" puca kad GitHub
          # osvjezi runner image na noviju verziju Visual Studija).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere nije nasao Visual Studio na runneru" }

          $redist = Join-Path $vsRoot 'VC\Redist\MSVC'
          $crt = Get-ChildItem "$redist\*\x64\Microsoft.VC1*.CRT"    -Directory | Sort-Object FullName | Select-Object -Last 1
          $omp = Get-ChildItem "$redist\*\x64\Microsoft.VC1*.OpenMP" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt -or -not $omp) { throw "VC++ redist folderi nisu nadjeni pod: $redist" }
          Copy-Item "$($crt.FullName)\vcruntime140.dll",
                    "$($crt.FullName)\vcruntime140_1.dll",
                    "$($crt.FullName)\msvcp140.dll" portable\
          Copy-Item "$($omp.FullName)\vcomp140.dll" portable\
          Get-ChildItem portable | Format-Table Name, Length

          Compress-Archive -Path portable\* `
            -DestinationPath "dist\SharpView-${{ steps.ver.outputs.version }}-win-x64-portable.zip"

      - name: Instaliraj Inno Setup
        run: choco install innosetup -y --no-progress

      # Instaler pakuje .\publish (PDB iskljucuje sam .iss); VC runtime NE
      # nosi u sebi - detektuje ga i po potrebi preuzme pri instalaciji.
      - name: Napravi instaler
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            installer\SharpView.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC je vratio $LASTEXITCODE" }

      - name: SHA256 sume
        shell: pwsh
        working-directory: dist
        run: |
          # Napomena: Get-ChildItem -Exclude bez wildcard putanje filtrira sam
          # direktorijum umjesto sadrzaja i vraca prazno - zato Where-Object.
          $lines = Get-ChildItem -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            }
          if (-not $lines) { throw 'dist je prazan - nema sta hesirati' }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Objavi release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create ${{ github.ref_name }} $files `
            --title "SharpView ${{ steps.ver.outputs.version }}" `
            --generate-notes

      # Kod rucnog pokretanja nema release-a, samo artefakti za provjeru
      - name: Sacuvaj artefakte
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: sharpview-${{ steps.ver.outputs.version }}
          path: dist/
          retention-days: 14
